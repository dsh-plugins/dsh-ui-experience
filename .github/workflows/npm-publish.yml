name: CI and npm Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # pnpm 必须先于 setup-node 安装：`cache: pnpm` 由 setup-node 调用 pnpm 定位锁文件。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Build package
        run: pnpm run build
      # 无 test 脚本的仓库（如纯客户端插件）跳过这一步，而不是让质量门禁因缺脚本失败。
      - name: Regression tests
        run: pnpm run --if-present test
      - name: Inspect npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: "quality"
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
    uses: dsh-plugins/dsh-npm-publish/.github/workflows/npm-publish.yml@main
    with:
      pnpm-version: "11"
      install-command: "pnpm install --frozen-lockfile"
      prepare-command: |
        pnpm run build
        pnpm run --if-present test
        npm pack --dry-run
